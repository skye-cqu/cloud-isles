<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>家园空岛概念图与四视图</title>
    <style>
      body { margin: 0; background: #1a1a1a; color: #ddd; font: 14px/1.6 system-ui, sans-serif; }
      header { padding: 16px 24px; }
      header h1 { margin: 0 0 4px; font-size: 18px; }
      header p { margin: 0; color: #999; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; padding: 0 24px 24px; }
      figure { margin: 0; background: #242424; border-radius: 8px; overflow: hidden; }
      img { width: 100%; height: auto; display: block; }
      figcaption { padding: 8px 12px; color: #bbb; }
      .concept { grid-column: 1 / -1; max-width: 860px; margin: 0 auto; }
    </style>
  </head>
  <body>
    <header>
      <h1>家园空岛概念图 · Lux3D multimodal-image + four-view</h1>
      <p>任务 4663264（概念图）/ 4663492（四视图）· 2026-11-05</p>
    </header>
    <div class="grid">
      <figure class="concept">
        <img src="/assets/aholo/home-island-concept-20261105.jpg" alt="家园空岛概念图" />
        <figcaption>概念图：布局参照（住宅/工棚/园艺台地/泊位/系船柱）</figcaption>
      </figure>
      <figure>
        <img src="/assets/aholo/home-island-fourview-20261105-front.png" alt="正面偏侧" />
        <figcaption>四视图 · 正面偏侧</figcaption>
      </figure>
      <figure>
        <img src="/assets/aholo/home-island-fourview-20261105-back-side.png" alt="相反方向偏侧" />
        <figcaption>四视图 · 相反方向偏侧</figcaption>
      </figure>
      <figure>
        <img src="/assets/aholo/home-island-fourview-20261105-side.png" alt="侧面" />
        <figcaption>四视图 · 侧面</figcaption>
      </figure>
      <figure>
        <img src="/assets/aholo/home-island-fourview-20261105-back.png" alt="背面" />
        <figcaption>四视图 · 背面</figcaption>
      </figure>
    </div>
  </body>
</html>

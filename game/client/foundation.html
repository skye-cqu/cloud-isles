<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Isles Foundation</title>
    <style>
      html, body, #foundation-canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #081426; color: #e9f4ff; font: 14px system-ui, sans-serif; }
      #foundation-panel { position: fixed; top: 16px; left: 16px; max-width: 440px; padding: 14px; background: #081426df; border: 1px solid #4979a4; border-radius: 8px; line-height: 1.5; }
      h1 { margin: 0 0 6px; font-size: 18px; } p { margin: 6px 0; } button { margin-top: 8px; padding: 6px 10px; color: inherit; background: #173a5b; border: 1px solid #6aa4cf; border-radius: 4px; cursor: pointer; }
    </style>
  </head>
  <body>
    <canvas id="foundation-canvas"></canvas>
    <section id="foundation-panel">
      <h1>独立开源组件基础</h1>
      <p id="foundation-status">正在加载本地 WASM…</p>
      <button id="foundation-pause" type="button">暂停 Yuka</button>
      <p>WASD/鼠标：原生 FlyCamera。点击紫色建造预览方块，再拖动 Gizmo 手柄位移/旋转；位移吸附 0.5m、旋转吸附 15°，缩放已禁用。</p>
      <p>此页不接入主存档、云端 API、云舟或生态循环。</p>
    </section>
    <script type="module" src="/src/foundation/demo.ts"></script>
  </body>
</html>
